<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f0f">
  <title>Muzeeka Remote</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #262626;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #888888;
      --accent: #b3b3b3;
      --accent2: #ffffff;
      --danger: #555555; 
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app {
      display: flex;
      flex-direction: column;
      max-width: 100%;
      margin: 0 auto;
    }

    .player-section {
      min-height: 100dvh; 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(70px + var(--safe-top)); 
      padding-bottom: calc(16px + var(--safe-bottom));
      flex-shrink: 0;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(15, 15, 15, 0.5); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: calc(16px + var(--safe-top)) 20px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0); 
      transition: padding 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  background 0.3s ease, border-color 0.3s ease;
    }

    .header.scrolled {
      padding: calc(8px + var(--safe-top)) 20px 8px;
      background: rgba(15, 15, 15, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-inner {
      position: relative;
      width: 100%;
      height: 32px;
    }

    .header-default, .header-scrolled-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    }

    .header-default {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .header.scrolled .header-default {
      opacity: 0;
      transform: translateY(-10px);
      visibility: hidden;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #aaaaaa;
      box-shadow: 0 0 8px rgba(170, 170, 170, 0.6);
    }

    .header-scrolled-content {
      opacity: 0;
      transform: translateY(10px);
      visibility: hidden;
    }

    .header.scrolled .header-scrolled-content {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .header-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding-right: 12px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .header-artist {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-time {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .btn-header {
      width: 32px;
      height: 32px;
      font-size: 14px;
      background: var(--surface2);
      color: var(--text);
      border: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    /* Icons are inlined as data: URIs in JS (same SVG as static/icons) */
    .icon {
      display: block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      object-fit: contain;
      pointer-events: none;
      /* White monochrome regardless of SVG fill/currentColor */
      filter: brightness(0) invert(1);
    }

    .btn-header .icon { width: 14px; height: 14px; }
    .btn-sm .icon { width: 20px; height: 20px; }
    .btn-md .icon { width: 24px; height: 24px; }
    .btn-lg .icon { width: 30px; height: 30px; }
    .vol-icon { width: 22px; height: 22px; opacity: 0.7; }

    .now-playing {
      flex: 1;
      padding: 8px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cover-wrap, .now-playing-meta {
      width: min(80vw, 340px);
    }

    .cover-wrap {
      aspect-ratio: 1;
      margin: 0 auto 16px;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
      position: relative;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 64px;
      color: var(--muted);
      background: linear-gradient(135deg, #222, #111);
    }

    .now-playing-meta {
      text-align: left;
    }

    .track-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0;
    }

    .track-artist {
      font-size: 16px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0;
    }

    .progress {
      padding: 0 20px;
      margin-top: auto;
    }

    .progress-bar {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #888, #fff);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .controls {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      border: none;
      background: var(--surface);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s, background 0.15s;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn:active { transform: scale(0.92); }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    .btn-sm { width: 44px; height: 44px; font-size: 18px; }
    .btn-md { width: 52px; height: 52px; font-size: 22px; }
    .btn-lg {
      width: 68px;
      height: 68px;
      font-size: 28px;
      background: var(--surface2);
      color: var(--accent2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .btn.active { color: var(--accent2); background: rgba(255,255,255,0.15); }

    .extra-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 20px 12px;
    }

    .volume-row {
      padding: 0 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-row input[type=range] {
      flex: 1;
      accent-color: var(--accent2);
      height: 4px;
    }

    .playlists-panel {
      flex: 1;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 50vh;
    }

    .panel-tabs {
      display: flex;
      gap: 4px;
      padding: 16px 16px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .panel-tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--surface2);
      color: var(--text);
    }

    .playlist-name {
      padding: 16px 20px 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .track-list {
      flex: 1;
      padding: 4px 12px 16px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .track-item:active { background: var(--surface2); }
    .track-item.playing { background: rgba(255, 255, 255, 0.1); }

    .track-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--surface2);
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: var(--muted);
    }

    .track-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info {
      min-width: 0;
      flex: 1;
    }

    .track-info-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-info-artist {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-dur {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .error-banner {
      display: none;
      margin: 0 20px 8px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: 13px;
      color: #ddd;
    }

    .error-banner.show { display: block; }

    .mini-time {
      display: none;
      flex-shrink: 0;
      align-items: center;
      gap: 3px;
      font-size: clamp(10px, 2.6vw, 12px);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    .mini-time-sep { opacity: 0.55; }

    @media (min-width: 768px) {
      .app {
        flex-direction: row;
        height: 100dvh;
        overflow: hidden;
      }

      .header {
        width: 50%;
        max-width: 500px;
      }

      .player-section {
        width: 50%;
        max-width: 500px;
        min-height: 100dvh;
        border-right: 1px solid var(--border);
        padding-bottom: 30px;
      }

      .playlists-panel {
        flex: 1;
        height: 100dvh;
        border-top: none;
        overflow-y: auto;
      }
      
      .cover-wrap, .now-playing-meta {
        width: min(35vw, 340px);
      }
    }

    @media (max-height: 199px) {
      html, body { overflow: hidden; height: 100%; }
      body { background: transparent; }
      .app {
        min-height: 100vh; height: 100vh; max-width: none; margin: 0; padding: 0;
        background: linear-gradient(180deg, rgba(20, 20, 20, 0.88) 0%, rgba(10, 10, 10, 0.94) 100%), var(--bg);
      }
      .header, .progress, .controls, .volume-row, .playlists-panel, .error-banner { display: none !important; }
      .player-section { flex: 1; display: flex; flex-direction: column; min-height: 0; border: none; padding-top: 0; }
      .now-playing { flex: 1; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 6px 10px; min-height: 0; cursor: pointer; }
      .cover-wrap { width: auto; height: min(72px, calc(100vh - 12px)); margin: 0; flex-shrink: 0; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45); }
      .now-playing-meta { width: auto; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .track-title { font-size: clamp(11px, 3.2vw, 14px); font-weight: 600; margin-bottom: 0; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85); }
      .track-artist { font-size: clamp(10px, 2.8vw, 12px); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
      .mini-time { display: flex; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="player-section">

      <div class="header" id="topHeader">
        <div class="header-inner">
          
          <div class="header-default">
            <div class="logo">MUZEEKA REMOTE</div>
            <div class="status-dot" id="statusDot"></div>
          </div>
          
          <div class="header-scrolled-content">
            <div class="header-meta">
              <div class="header-title" id="headerTitle">Ничего не играет</div>
              <div class="header-artist" id="headerArtist">—</div>
            </div>
            <div class="header-controls">
              <span class="header-time" id="headerTime">0:00</span>
              <button class="btn-header" id="btnHeaderPlay" title="Play/Pause" aria-label="Play/Pause">
                <img class="icon" id="iconHeaderPlay" data-icon="play" src="" alt="" aria-hidden="true">
              </button>
            </div>
          </div>
          
        </div>
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <div class="now-playing">
        <div class="cover-wrap" id="coverWrap">
          <div class="cover-placeholder" id="coverPlaceholder">♪</div>
          <img id="coverImg" alt="" style="display:none">
        </div>
        <div class="now-playing-meta">
          <div class="track-title" id="trackTitle">Ничего не играет</div>
          <div class="track-artist" id="trackArtist">Открой плейлист и выбери трек</div>
        </div>
        <div class="mini-time" id="miniTime" aria-label="Playback position">
          <span id="miniTimeCurrent">0:00</span>
          <span class="mini-time-sep">/</span>
          <span id="miniTimeTotal">0:00</span>
        </div>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-sm" id="btnShuffle" title="Shuffle" aria-label="Shuffle">
          <img class="icon" id="iconShuffle" data-icon="noshuffle" src="" alt="" aria-hidden="true">
        </button>
        <button class="btn btn-md" id="btnPrev" title="Previous" aria-label="Previous">
          <img class="icon" data-icon="playbackward" src="" alt="" aria-hidden="true">
        </button>
        <button class="btn btn-lg" id="btnPlay" title="Play/Pause" aria-label="Play/Pause">
          <img class="icon" id="iconPlay" data-icon="play" src="" alt="" aria-hidden="true">
        </button>
        <button class="btn btn-md" id="btnNext" title="Next" aria-label="Next">
          <img class="icon" data-icon="playforward" src="" alt="" aria-hidden="true">
        </button>
        <button class="btn btn-sm" id="btnRepeat" title="Repeat" aria-label="Repeat">
          <img class="icon" id="iconRepeat" data-icon="norepeat" src="" alt="" aria-hidden="true">
        </button>
      </div>

      <div class="volume-row">
        <img class="icon vol-icon" id="iconVolume" data-icon="volmed" src="" alt="" aria-hidden="true">
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>

    <div class="playlists-panel">
      <div class="panel-tabs" id="playlistTabs"></div>
      <div class="playlist-name" id="playlistName">Плейлист</div>
      <div class="track-list" id="trackList"></div>
    </div>
  </div>

  <audio id="silentKeeper" playsinline webkit-playsinline preload="auto" style="display:none"></audio>

  <script>
    const $ = (id) => document.getElementById(id);


    // SVG icons inlined from static/icons (no network / no disk paths on phone)

      "play": "<svg width=\"49\" height=\"48\" viewBox=\"0 0 49 48\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"> <path d=\"M12.7286 41.25C12.141 41.2489 11.5638 41.098 11.0538 40.8122C9.90535 40.1747 9.19141 38.9372 9.19141 37.5937V10.4062C9.19141 9.05905 9.90535 7.82529 11.0538 7.18779C11.5759 6.89383 12.1691 6.74266 12.7713 6.75008C13.3735 6.7575 13.9626 6.92324 14.4771 7.22998L38.1971 21.1387C38.6915 21.4424 39.099 21.864 39.3815 22.3642C39.6639 22.8643 39.8121 23.4265 39.8121 23.9981C39.8121 24.5697 39.6639 25.1319 39.3815 25.632C39.099 26.1322 38.6915 26.5538 38.1971 26.8575L14.4733 40.77C13.9468 41.0818 13.3438 41.2477 12.7286 41.25Z\" fill=\"#FEFEFE\"/> </svg>",

    function iconSrc(name) {
      const svg = ICONS_SVG[name];
      if (!svg) return '';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function setIcon(el, name) {
      if (!el) return;
      const src = iconSrc(name);
      if (src && el.getAttribute('src') !== src) el.setAttribute('src', src);
    }

    function setVolumeIcon(vol) {
      const v = Number(vol) || 0;
      const name = v <= 0 ? 'mute' : v > 0.66 ? 'volmax' : v > 0.33 ? 'volmed' : 'volmin';
      setIcon($('iconVolume'), name);
    }

    document.querySelectorAll('[data-icon]').forEach((el) => {
      setIcon(el, el.dataset.icon);
    });

    const LS_PLAYLIST_KEY = 'muzeeka-remote-active-playlist';
    const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let state = null;
    let playlists = [];
    let activePlaylistId = null;
    let playlistTracks = [];
    let volumeDragging = false;
    let seekDragging = false;
    let userPickedPlaylist = false;
    let volumeSendTimer = null;
    let lastTrackListPath = null;
    let mediaSessionReady = false;
    let mediaSessionEnabled = false;
    let silentBlobUrl = null;
    let silentBlobDuration = 0;
    let wakeLock = null;
    let lastMediaPositionSync = 0;
    let keeperSyncRAF = null;

    function fmt(sec) {
      if (!sec || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    window.addEventListener('scroll', () => {
      const header = $('topHeader');
      const playerSection = document.querySelector('.player-section');
      
      const threshold = playerSection ? (playerSection.offsetHeight - 80) : 150;

      if (window.scrollY > threshold) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || res.statusText);
      }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return res.json();
      return null;
    }

    function showError(msg) {
      const el = $('errorBanner');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    function applyTransportOptimistic(path) {
      if (!state) return;
      if (path === '/api/toggle') {
        if (state.isPlaying) {
          state.isPlaying = false;
          state.isPaused = true;
        } else {
          state.isPlaying = true;
          state.isPaused = false;
        }
      } else if (path === '/api/pause') {
        state.isPlaying = false;
        state.isPaused = true;
      } else if (path === '/api/resume') {
        state.isPlaying = true;
        state.isPaused = false;
      }
      renderNowPlaying();
    }

    async function action(path, body, opts = {}) {
      if (!mediaSessionEnabled) void tryEnableSystemMedia();
      if (opts.optimistic) applyTransportOptimistic(path);
      try {
        await api(path, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
        if (!opts.skipRefresh) await refreshState();
      } catch (e) {
        await refreshState();
        showError(e.message);
      }
    }

    async function mediaAction(path, body) {
      try {
        await api(path, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
        await refreshState();
      } catch (_) {}
    }

    function setupMediaSession() {
      if (mediaSessionReady) return;
      if (!('mediaSession' in navigator)) return;

      bindMediaHandlers();
      mediaSessionReady = true;
    }

    function bindMediaHandlers() {
      if (!('mediaSession' in navigator)) return;

      const bind = (actionName, handler) => {
        try {
          navigator.mediaSession.setActionHandler(actionName, handler);
        } catch (_) {}
      };

      bind('play', () => {
        void mediaAction(state?.isPaused ? '/api/resume' : '/api/toggle');
      });
      bind('pause', () => { void mediaAction('/api/pause'); });
      bind('stop', () => { void mediaAction('/api/pause'); });
      bind('previoustrack', () => { void mediaAction('/api/prev'); });
      bind('nexttrack', () => { void mediaAction('/api/next'); });

      if (!IS_IOS) {
        bind('seekbackward', () => {
          const pos = Math.max(0, (state?.position ?? 0) - 10);
          void mediaAction('/api/seek', { position: pos });
        });
        bind('seekforward', () => {
          const dur = state?.duration ?? 0;
          const pos = dur > 0 ? Math.min(dur, (state?.position ?? 0) + 10) : (state?.position ?? 0) + 10;
          void mediaAction('/api/seek', { position: pos });
        });
        bind('seekto', (details) => {
          if (details.seekTime != null) {
            void mediaAction('/api/seek', { position: details.seekTime });
          }
        });
      }
    }

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}
    }

    function syncKeeperClock(force = false) {
      const keeper = $('silentKeeper');
      const pos = state?.position ?? 0;
      if (!keeper || !Number.isFinite(pos) || !keeper.duration || keeper.duration <= 0) return;

      const now = Date.now();
      if (!force && now - lastMediaPositionSync < 800) return;
      lastMediaPositionSync = now;

      const target = Math.min(pos, keeper.duration - 0.1);
      if (target >= 0 && Math.abs(keeper.currentTime - target) > 0.3) {
        try {
          keeper.currentTime = target;
        } catch (_) {}
      }
    }

    async function syncSilentKeeper() {
      const keeper = $('silentKeeper');
      if (!keeper || !mediaSessionEnabled) return;

      keeper.volume = 0.01;
      const hasTrack = !!state?.track;
      const playing = !!state?.isPlaying;
      const paused = !!state?.isPaused;
      const dur = state?.duration ?? 0;

      if (dur > 0 && Math.abs(dur - silentBlobDuration) > 1) {
        const newUrl = createSilentBlobUrl(dur);
        if (keeper.src !== newUrl) {
          const wasPlaying = !keeper.paused;
          keeper.src = newUrl;
          keeper.load();
          if (wasPlaying || playing) {
            try { await keeper.play(); } catch (_) {}
          }
        }
      }

      if (hasTrack && playing) {
        syncKeeperClock(true);
        if (keeper.paused) {
          try { await keeper.play(); } catch (_) {}
        }
        startKeeperSync();
      } else if (hasTrack && paused) {
        syncKeeperClock(true);
        if (!keeper.paused) keeper.pause();
        stopKeeperSync();
      } else {
        if (!keeper.paused) keeper.pause();
        stopKeeperSync();
      }
    }

    function startKeeperSync() {
      if (keeperSyncRAF) return;
      const tick = () => {
        syncKeeperClock(false);
        keeperSyncRAF = requestAnimationFrame(tick);
      };
      keeperSyncRAF = requestAnimationFrame(tick);
    }

    function stopKeeperSync() {
      if (keeperSyncRAF) {
        cancelAnimationFrame(keeperSyncRAF);
        keeperSyncRAF = null;
      }
    }

    function setMediaMetadata(track) {
      if (!mediaSessionReady) return;
      try {
        if (track) {
          const artwork = [];
          if (track.coverUrl) {
            const src = new URL(track.coverUrl, location.origin).href;
            artwork.push({ src, sizes: '512x512', type: 'image/jpeg' });
            artwork.push({ src, sizes: '256x256', type: 'image/jpeg' });
            artwork.push({ src, sizes: '96x96', type: 'image/jpeg' });
          }
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title || 'Muzeeka',
            artist: track.artist || 'Unknown Artist',
            album: track.album || 'Muzeeka',
            artwork,
          });
          document.title = `${track.title || 'Muzeeka'} — Muzeeka`;
        } else {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Muzeeka Remote',
            artist: 'Ничего не играет',
            album: 'Muzeeka',
          });
          document.title = 'Muzeeka Remote';
        }
      } catch (_) {}
    }

    function updateMediaSession() {
      if (!mediaSessionReady) return;

      const track = state?.track;
      const playing = !!state?.isPlaying;
      const paused = !!state?.isPaused;

      setMediaMetadata(track);
      if (IS_IOS) bindMediaHandlers();

      try {
        navigator.mediaSession.playbackState = playing ? 'playing' : paused ? 'paused' : 'none';
      } catch (_) {}

      if (!mediaSessionEnabled) return;

      if (!IS_IOS && 'setPositionState' in navigator.mediaSession) {
        const dur = state?.duration ?? 0;
        const pos = state?.position ?? 0;
        if (dur > 0 && Number.isFinite(pos)) {
          try {
            navigator.mediaSession.setPositionState({
              duration: dur,
              playbackRate: 1,
              position: Math.min(Math.max(0, pos), dur),
            });
          } catch (_) {}
        }
      } else {
        syncKeeperClock();
      }

      void syncSilentKeeper();
    }

    function createSilentBlobUrl(durationSec = 0.5) {
      if (silentBlobUrl && Math.abs(silentBlobDuration - durationSec) < 1) {
        return silentBlobUrl;
      }
      if (silentBlobUrl) {
        URL.revokeObjectURL(silentBlobUrl);
        silentBlobUrl = null;
      }

      const sampleRate = 1000;
      const channels = 1;
      const bits = 16;
      const clampedDuration = Math.max(0.5, Math.min(durationSec, 7200));
      const samples = Math.max(1, Math.floor(sampleRate * clampedDuration));
      const dataSize = samples * channels * (bits / 8);
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, channels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * channels * bits / 8, true);
      view.setUint16(32, channels * bits / 8, true);
      view.setUint16(34, bits, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      silentBlobUrl = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
      silentBlobDuration = clampedDuration;
      return silentBlobUrl;
    }

    function prepareSilentKeeper() {
      const keeper = $('silentKeeper');
      if (!keeper) return;
      const dur = state?.duration ?? 0.5;
      keeper.src = createSilentBlobUrl(dur > 0 ? dur : 0.5);
      keeper.loop = false;
      keeper.volume = 0.01;
      keeper.muted = false;
      keeper.preload = 'auto';

      keeper.addEventListener('ended', () => {
        if (state?.isPlaying && mediaSessionEnabled) {
          syncKeeperClock(true);
          try { keeper.play(); } catch (_) {}
        }
      });
    }

    async function tryEnableSystemMedia() {
      if (mediaSessionEnabled) return true;
      setupMediaSession();
      if (!mediaSessionReady) return false;
      const keeper = $('silentKeeper');
      if (!keeper) return false;

      try {
        prepareSilentKeeper();
        if (keeper.paused) await keeper.play();
        mediaSessionEnabled = true;
        await requestWakeLock();
        updateMediaSession();
        return true;
      } catch (_) {
        return false;
      }
    }

    function bindMediaUnlock() {
      const unlock = () => {
        if (mediaSessionEnabled) return;
        void tryEnableSystemMedia();
      };
      ['pointerdown', 'touchstart', 'keydown'].forEach((eventName) => {
        document.addEventListener(eventName, unlock, { capture: true, passive: true });
      });
    }

    function renderNowPlaying() {
      const track = state?.track;
      
      $('trackTitle').textContent = track?.title || 'Ничего не играет';
      $('trackArtist').textContent = track?.artist || '—';
      
      $('headerTitle').textContent = track?.title || 'Ничего не играет';
      $('headerArtist').textContent = track?.artist || '—';

      const img = $('coverImg');
      const ph = $('coverPlaceholder');
      if (track?.coverUrl) {
        img.src = track.coverUrl;
        img.style.display = 'block';
        ph.style.display = 'none';
      } else {
        img.style.display = 'none';
        ph.style.display = 'grid';
      }

      const dur = state?.duration || 0;
      const pos = state?.position || 0;
      const pct = dur > 0 ? (pos / dur) * 100 : 0;
      $('progressFill').style.width = `${pct}%`;
      
      const posFormatted = fmt(pos);
      $('timeCurrent').textContent = posFormatted;
      $('timeTotal').textContent = fmt(dur);
      $('miniTimeCurrent').textContent = posFormatted;
      $('miniTimeTotal').textContent = fmt(dur);
      $('headerTime').textContent = posFormatted;

      const playing = state?.isPlaying;
      setIcon($('iconPlay'), playing ? 'pause' : 'play');
      setIcon($('iconHeaderPlay'), playing ? 'pause' : 'play');

      const shuffleOn = !!state?.shuffleEnabled;
      setIcon($('iconShuffle'), shuffleOn ? 'shuffle' : 'noshuffle');
      $('btnShuffle').classList.toggle('active', shuffleOn);

      const repeat = state?.repeatMode || 'off';
      setIcon(
        $('iconRepeat'),
        repeat === 'one' ? 'repeat' : repeat === 'all' ? 'repeatplaylist' : 'norepeat'
      );
      $('btnRepeat').classList.toggle('active', repeat !== 'off');

      if (!volumeDragging && state?.volume != null) {
        $('volumeSlider').value = Math.round(state.volume * 100);
        setVolumeIcon(state.volume);
      }

      highlightPlayingTrack();
      updateMediaSession();
    }

    function highlightPlayingTrack() {
      const currentPath = state?.track?.path ?? null;
      if (currentPath === lastTrackListPath) return;
      lastTrackListPath = currentPath;
      const list = $('trackList');
      list.querySelectorAll('.track-item').forEach((el) => {
        el.classList.toggle('playing', !!currentPath && el.dataset.path === currentPath);
      });
    }

    function renderTabs() {
      const tabs = $('playlistTabs');
      tabs.innerHTML = playlists.map((p) =>
        `<button class="tab${p.id === activePlaylistId ? ' active' : ''}" data-id="${p.id}">${escapeHtml(p.name)}</button>`
      ).join('');

      tabs.querySelectorAll('.tab').forEach((btn) => {
        btn.addEventListener('click', async () => {
          activePlaylistId = btn.dataset.id;
          userPickedPlaylist = true;
          localStorage.setItem(LS_PLAYLIST_KEY, activePlaylistId);
          renderTabs();
          try {
            await api('/api/playlist/select', {
              method: 'POST',
              body: JSON.stringify({ id: activePlaylistId }),
            });
            await loadPlaylist(activePlaylistId);
          } catch (e) {
            showError(e.message);
          }
        });
      });
    }

    function renderTrackList() {
      const list = $('trackList');
      const currentPath = state?.track?.path;
      lastTrackListPath = null;
      list.innerHTML = playlistTracks.map((t) => {
        const playing = t.path === currentPath;
        const thumb = t.coverUrl
          ? `<img src="${t.coverUrl}" alt="">`
          : '♪';
        return `<div class="track-item${playing ? ' playing' : ''}" data-path="${escapeAttr(t.path)}">
          <div class="track-thumb">${thumb}</div>
          <div class="track-info">
            <div class="track-info-title">${escapeHtml(t.title)}</div>
            <div class="track-info-artist">${escapeHtml(t.artist)}</div>
          </div>
          <div class="track-dur">${fmt(t.durationSecs)}</div>
        </div>`;
      }).join('');

      list.querySelectorAll('.track-item').forEach((el) => {
        el.addEventListener('click', () => {
          action('/api/play', { path: el.dataset.path, playlistId: activePlaylistId });
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    }

    async function refreshState() {
      try {
        const next = await api('/api/state');
        applyState(next);
      } catch (e) {
        $('statusDot').style.background = '#555555';
      }
    }

    function applyState(next) {
      if (!next || typeof next !== 'object') return;
      state = next;
      $('statusDot').style.background = '#aaaaaa';
      renderNowPlaying();
      if (
        !userPickedPlaylist &&
        next?.activePlaylistId &&
        next.activePlaylistId !== activePlaylistId
      ) {
        activePlaylistId = next.activePlaylistId;
        localStorage.setItem(LS_PLAYLIST_KEY, activePlaylistId);
        void loadPlaylist(activePlaylistId).then(() => renderTabs());
      }
      updateMediaSession();
    }

    let stateStream = null;
    let stateStreamRetryTimer = null;

    function connectStateStream() {
      if (stateStream) {
        try { stateStream.close(); } catch (_) {}
        stateStream = null;
      }
      if (stateStreamRetryTimer) {
        clearTimeout(stateStreamRetryTimer);
        stateStreamRetryTimer = null;
      }
      if (typeof EventSource === 'undefined') {
        // Fallback for very old browsers: keep polling.
        if (!window.__muzeekaPoll) {
          window.__muzeekaPoll = setInterval(refreshState, 500);
        }
        return;
      }
      try {
        const es = new EventSource('/api/stream?interval=250');
        stateStream = es;
        es.addEventListener('state', (ev) => {
          try {
            applyState(JSON.parse(ev.data));
          } catch (_) {}
        });
        es.onerror = () => {
          $('statusDot').style.background = '#555555';
          // EventSource reconnects while CONNECTING; only re-open if fully closed.
          if (es.readyState === EventSource.CLOSED) {
            stateStream = null;
            stateStreamRetryTimer = setTimeout(connectStateStream, 1500);
          }
        };
      } catch (_) {
        if (!window.__muzeekaPoll) {
          window.__muzeekaPoll = setInterval(refreshState, 500);
        }
      }
    }

    async function loadPlaylists() {
      playlists = await api('/api/playlists');
      renderTabs();
    }

    function resolveInitialPlaylist() {
      const saved = localStorage.getItem(LS_PLAYLIST_KEY);
      if (saved && playlists.some((p) => p.id === saved)) {
        return saved;
      }
      if (state?.activePlaylistId && playlists.some((p) => p.id === state.activePlaylistId)) {
        return state.activePlaylistId;
      }
      return playlists[0]?.id ?? null;
    }

    async function loadPlaylist(id) {
      if (!id) return;
      const view = await api(`/api/playlist?id=${encodeURIComponent(id)}`);
      playlistTracks = view.tracks || [];
      $('playlistName').textContent = view.name || 'Плейлист';
      renderTrackList();
    }

    async function init() {
      setupMediaSession();
      prepareSilentKeeper();
      bindMediaUnlock();
      void tryEnableSystemMedia();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (!mediaSessionEnabled) void tryEnableSystemMedia();
          if (mediaSessionEnabled) {
            void requestWakeLock();
            void syncSilentKeeper();
            updateMediaSession();
          }
        }
      });
      try {
        await loadPlaylists();
        await refreshState();
        activePlaylistId = resolveInitialPlaylist();
        if (activePlaylistId) {
          localStorage.setItem(LS_PLAYLIST_KEY, activePlaylistId);
          await loadPlaylist(activePlaylistId);
        }
        renderTabs();
        updateMediaSession();
        if (state?.track && (state.isPlaying || state.isPaused)) {
          void tryEnableSystemMedia();
        }
      } catch (e) {
        showError('Не удалось подключиться к Muzeeka');
      }
    }

    document.querySelector('.now-playing')?.addEventListener('click', () => {
      if (window.innerHeight >= 200) return;
      action('/api/toggle', null, { optimistic: true });
    });

    $('btnPlay').addEventListener('click', () => action('/api/toggle', null, { optimistic: true }));
    $('btnHeaderPlay').addEventListener('click', () => action('/api/toggle', null, { optimistic: true }));
    $('btnPause')?.addEventListener('click', () => action('/api/pause', null, { optimistic: true }));
    $('btnPrev').addEventListener('click', () => action('/api/prev'));
    $('btnNext').addEventListener('click', () => action('/api/next'));
    $('btnShuffle').addEventListener('click', () => action('/api/shuffle/toggle'));
    $('btnRepeat').addEventListener('click', () => action('/api/repeat/toggle'));

    $('volumeSlider').addEventListener('input', (e) => {
      volumeDragging = true;
      const vol = e.target.value / 100;
      if (state) state.volume = vol;
      setVolumeIcon(vol);
      if (volumeSendTimer) clearTimeout(volumeSendTimer);
      volumeSendTimer = setTimeout(() => {
        api('/api/volume', { method: 'POST', body: JSON.stringify({ volume: vol }) })
          .catch((err) => showError(err.message))
          .finally(() => {
            setTimeout(() => { volumeDragging = false; }, 120);
          });
      }, 120);
    });

    function seekFromEvent(e) {
      const bar = $('progressBar');
      const rect = bar.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const ratio = Math.max(0, Math.min(1, x / rect.width));
      const dur = state?.duration || 0;
      if (dur > 0) action('/api/seek', { position: ratio * dur });
    }

    $('progressBar').addEventListener('click', seekFromEvent);
    $('progressBar').addEventListener('touchstart', (e) => { seekDragging = true; seekFromEvent(e); });
    $('progressBar').addEventListener('touchmove', (e) => { if (seekDragging) seekFromEvent(e); });
    $('progressBar').addEventListener('touchend', () => { seekDragging = false; });

    init();
    connectStateStream();
  </script>
</body>
</html>
