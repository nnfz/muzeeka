<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Muzeeka" />
    <title>Muzeeka</title>

    <!-- Prevent white flash on window show (especially settings window) -->
    <style>
      html, body {
        background-color: #0a0a0f !important;
        margin: 0;
        padding: 0;
      }
    </style>

    <script>
      // Force dark background as early as possible to avoid white flash when window is shown
      (function() {
        try {
          document.documentElement.style.backgroundColor = '#0a0a0f';
          if (document.body) document.body.style.backgroundColor = '#0a0a0f';
        } catch(e) {}
      })();

      document.addEventListener(
        'contextmenu',
        (event) => event.preventDefault(),
        { capture: true }
      );

      // Kill WebView2/Edge default accelerators before they open Find/Print chrome.
      // (Ctrl+F focus for in-app search is handled in +page.svelte.)
      document.addEventListener(
        'keydown',
        (event) => {
          const mod = event.ctrlKey || event.metaKey;
          if (!mod && event.code !== 'F3') return;
          if (event.code === 'KeyP' && mod && !event.altKey) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          if (event.code === 'KeyF' && mod && !event.altKey) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          if (event.code === 'F3' || (mod && !event.altKey && event.code === 'KeyG')) {
            event.preventDefault();
            event.stopPropagation();
          }
        },
        { capture: true }
      );
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
